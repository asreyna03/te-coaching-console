[theme]
base = "light"
primaryColor = "#E4531F"
backgroundColor = "#EFEDE6"
secondaryBackgroundColor = "#E8E4DB"
textColor = "#17150F"
font = "sans serif"

[server]
port = 8600
headless = true
enableCORS = false
# No dev file-watching in prod (local dev: streamlit run --server.fileWatcherType auto)
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
